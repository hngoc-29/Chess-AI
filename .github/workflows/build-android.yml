name: Build Android

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            game/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        working-directory: ./game
        run: flutter pub get

      - name: Generate Android launcher icons
        working-directory: ./game
        run: |
          echo "🎯 Generating launcher icons for Chess AI..."
          BG_COLOR="#22313F"
          FG_COLOR="#2ECC71"
          BASE_DIR="android/app/src/main/res"

          for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            IFS=':' read -r pixels density <<< "$size"
            output="$BASE_DIR/mipmap-$density/ic_launcher.png"

            convert -size ${pixels}x${pixels} xc:"$BG_COLOR" \
                    -fill "$FG_COLOR" \
                    -draw "rectangle $((pixels/4)),$((pixels/4)) $((pixels*3/4)),$((pixels*3/4))" \
                    -stroke white -strokewidth $((pixels/48 > 0 ? pixels/48 : 1)) \
                    -draw "rectangle $((pixels/4)),$((pixels/4)) $((pixels*3/4)),$((pixels*3/4))" \
                    "$output"

            echo "✓ Created $density icon (${pixels}x${pixels})"
          done

          echo "✅ All launcher icons generated successfully!"

      - name: Build APK
        working-directory: ./game
        run: flutter build apk --release

      - name: Build App Bundle
        working-directory: ./game
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: game/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: game/build/app/outputs/bundle/release/*.aab
