name: Build Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./game
        run: flutter pub get

      - name: Build Windows
        working-directory: ./game
        run: flutter build windows --release

      - name: Create ZIP
        run: Compress-Archive -Path game/build/windows/x64/runner/Release/* -DestinationPath chess-ai-windows.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: chess-ai-windows.zip
