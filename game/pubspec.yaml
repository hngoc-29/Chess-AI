name: kings_gambit_ai
description: Professional Chess AI Game with MCTS Engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio
  audioplayers: ^5.2.1

  # Functional Programming
  dartz: ^0.10.1

  # State Management
  equatable: ^2.0.5
  flutter_bloc: ^8.1.3

  # UI & Design
  flutter_svg: ^2.0.9

  # Dependency Injection
  get_it: ^7.6.4

  # UI & Design
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.18.1
  json_annotation: ^4.8.1
  logger: ^2.0.2
  lottie: ^3.0.0

  # Storage & Files
  path_provider: ^2.1.1
  share_plus: ^10.0.2
  shared_preferences: ^2.2.2

  # AI Engine (Maia via Leela Chess Zero / lc0)
  # NOTE: using a git dependency, not the pub.dev hosted version, on purpose.
  # The published 1.0.0 package on pub.dev is missing 3 pre-generated
  # protobuf headers (ios/lc0/build/proto/{net,hlo,onnx}.pb.h) that the
  # Android CMake build needs (#include "proto/net.pb.h" fails otherwise).
  # Those files ARE tracked in the package's git repo (force-added past a
  # `build/` .gitignore rule) but appear to have been dropped when the
  # package was published to pub.dev. A git dependency pulls the real repo
  # instead of the pub.dev archive, so the files are present. If a future
  # pub.dev release fixes this, this can switch back to a normal version
  # constraint - see game/docs/maia_integration.md for details.
  leela_chess_zero:
    git:
      url: https://github.com/ArjanAswal/LeelaChessZero.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  build_runner: ^2.4.7
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/pieces/cburnett/
    - assets/images/pieces/merida/
    - assets/images/pieces/alpha/
    - assets/images/pieces/pixel/
    - assets/images/boards/
    - assets/sounds/
    - assets/animations/lottie/
    - assets/weights/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
