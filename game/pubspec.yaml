name: chess_ai
description: Professional Chess AI Game with MCTS Engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0

  # Audio
  audioplayers: ^5.2.1

  # Storage & Files
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  share_plus: ^10.0.2

  # Utilities
  intl: ^0.18.1
  json_annotation: ^4.8.1
  dartz: ^0.10.1
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/pieces/cburnett/
    - assets/images/pieces/merida/
    - assets/images/pieces/alpha/
    - assets/images/pieces/pixel/
    - assets/images/boards/
    - assets/sounds/
    - assets/animations/lottie/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
