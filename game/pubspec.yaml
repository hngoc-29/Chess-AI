name: kings_gambit_ai
description: Professional Chess AI Game with MCTS Engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio
  audioplayers: ^5.2.1

  # Functional Programming
  dartz: ^0.10.1

  # State Management
  equatable: ^2.0.5
  flutter_bloc: ^8.1.3

  # UI & Design
  flutter_svg: ^2.0.9

  # Dependency Injection
  get_it: ^7.6.4

  # UI & Design
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.18.1
  json_annotation: ^4.8.1
  logger: ^2.0.2

  # Storage & Files
  path_provider: ^2.1.1
  share_plus: ^10.0.2
  shared_preferences: ^2.2.2

  # AI Engine: Maia neural nets run directly via ONNX Runtime (no external
  # chess-engine binary/subprocess needed). See game/docs/maia_integration.md
  # for why this replaced an earlier lc0-based approach.
  flutter_onnxruntime: ^1.7.0

  # Online Multiplayer
  socket_io_client: ^2.0.3+1
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  chess: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  build_runner: ^2.4.7
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/pieces/cburnett/
    - assets/images/pieces/merida/
    - assets/images/pieces/alpha/
    - assets/images/pieces/pixel/
    - assets/images/boards/
    - assets/images/branding/
    - assets/sounds/
    - assets/onnx/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
